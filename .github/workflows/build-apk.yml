name: Build APK Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (ex: 1.1.0)'
        required: false
        default: '1.1.0'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.0'
        channel: 'stable'
        cache: true
        
    - name: Install dependencies
      run: flutter pub get
      
    - name: Analyze code
      run: flutter analyze --no-fatal-infos
      
    - name: Run tests (if any)
      run: flutter test --no-pub || true
      
    - name: Build APK Release
      run: |
        flutter build apk --release --verbose
        ls -la build/app/outputs/flutter-apk/
        
    - name: Rename APK with version
      run: |
        VERSION=$(grep '^version:' pubspec.yaml | cut -d' ' -f2 | cut -d'+' -f1)
        BUILD_NUMBER=$(grep '^version:' pubspec.yaml | cut -d'+' -f2)
        cp build/app/outputs/flutter-apk/app-release.apk \
           build/app/outputs/flutter-apk/daoukro-user-v${VERSION}+${BUILD_NUMBER}.apk
        
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: daoukro-user-apk
        path: |
          build/app/outputs/flutter-apk/app-release.apk
          build/app/outputs/flutter-apk/daoukro-user-v*.apk
        retention-days: 30
        
    - name: Create Release (si tag)
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          build/app/outputs/flutter-apk/app-release.apk
          build/app/outputs/flutter-apk/daoukro-user-v*.apk
        generate_release_notes: true
        draft: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}